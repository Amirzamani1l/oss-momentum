name: Collect

on:
  schedule:
    # Three times a day. Odd minutes so runs are not queued behind the
    # top-of-hour stampede on GitHub's scheduler.
    - cron: "17 1 * * *"
    - cron: "43 9 * * *"
    - cron: "29 17 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Fetch but write nothing"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # A personal access token, when present, attributes the pull request
      # and issues to the repository owner and lets CI run on the PR.
      # Falls back to the built-in token, which still works but shows up
      # as github-actions[bot].
      GH_TOKEN: ${{ secrets.RADAR_TOKEN || github.token }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RADAR_TOKEN || github.token }}

      - name: Skip Fridays
        id: gate
        run: |
          # Friday in Asia/Tehran, not UTC — the two do not line up.
          if [ "$(TZ=Asia/Tehran date +%u)" = "5" ]; then
            echo "Friday in Tehran; skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Collect
        id: collect
        if: steps.gate.outputs.run == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python scripts/collect.py --dry-run
            exit 0
          fi

          MESSAGE=$(python scripts/collect.py | tail -n 1)
          echo "message=$MESSAGE" >> "$GITHUB_OUTPUT"

      - name: Open pull request
        id: pr
        if: steps.gate.outputs.run == 'true' && inputs.dry_run != true
        run: |
          set -euo pipefail

          # Author as the repository owner so the commit counts as a
          # contribution; the bot identity would not.
          git config user.name  "${{ github.repository_owner }}"
          git config user.email "${{ vars.GIT_EMAIL }}"

          if git diff --quiet -- data charts README.md; then
            echo "No change in the data; nothing to propose."
            exit 0
          fi

          BRANCH="data/$(date -u +%Y-%m-%d-%H%M)"
          git checkout -b "$BRANCH"
          git add data charts README.md
          git commit -m "${{ steps.collect.outputs.message }}"
          git push -u origin "$BRANCH"

          # The diff is machine-generated, so the body summarises what
          # changed rather than asking a human to read 42 changed rows.
          {
            echo "Automated data update."
            echo
            echo '```'
            git diff --stat "origin/${{ github.ref_name }}...$BRANCH" -- data charts
            echo '```'
            echo
            echo "Merged automatically once CI passes."
          } > /tmp/pr-body.md

          PR_URL=$(gh pr create \
            --base "${{ github.ref_name }}" \
            --head "$BRANCH" \
            --title "${{ steps.collect.outputs.message }}" \
            --body-file /tmp/pr-body.md)

          echo "url=$PR_URL" >> "$GITHUB_OUTPUT"
          echo "Opened $PR_URL"

      - name: Merge pull request
        if: steps.pr.outputs.url != ''
        run: |
          # --squash keeps main at one commit per run rather than one per
          # branch plus a merge commit.
          gh pr merge "${{ steps.pr.outputs.url }}" --squash --delete-branch

      - name: Sync issues
        if: steps.gate.outputs.run == 'true' && inputs.dry_run != true
        continue-on-error: true
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.RADAR_TOKEN || github.token }}
        run: |
          # Never fatal: a rejected issue write must not fail a run whose
          # data has already landed.
          git checkout "${{ github.ref_name }}"
          git pull --ff-only
          python scripts/sync_issues.py

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-output
          path: |
            data/
            charts/
          retention-days: 7
